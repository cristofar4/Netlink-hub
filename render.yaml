# NetLink on Render.
#
# Committed rather than clicked through a dashboard, so the deployment is
# reviewable, repeatable, and the same next month as it is today. Render reads
# this file directly: point a Blueprint at this repository and it creates both
# services with these settings.
#
# What you still have to supply by hand, and why each one cannot be in here:
#
#   SMTP_HOST / SMTP_USER / SMTP_PASSWORD
#       Credentials. Set them in the Render dashboard.
#       You need a real SMTP provider — Brevo and Resend both have free tiers
#       big enough for this. Without one, no six-digit codes arrive and nobody
#       can sign in, including you.
#
#   MAIL_FROM
#       Must be an address your SMTP provider has verified you may send from.
#
#   BRAND_NAME / BRAND_URL / BRAND_SUPPORT_EMAIL / BRAND_FOOTER
#       Your company, as it appears in every verification email. Set at least
#       BRAND_NAME, and make it agree with the domain in MAIL_FROM — people are
#       being asked to trust a six-digit code, and the sender is the only thing
#       they have to check it against.
#
# Everything marked `generateValue: true` is created once by Render and never
# printed. That is deliberate for the two signing keys: if either leaks, every
# session and every power command signed with it is suspect.

databases:
  - name: netlink-db
    databaseName: netlink
    user: netlink
    # Free Postgres on Render is deleted after 30 days. That is fine for
    # trying NetLink and not fine for keeping anything. Move to a paid
    # instance, or a VPS with docker-compose.yml, before it matters.
    plan: free

services:
  - type: web
    name: netlink-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: netlink-db
          property: connectionString

      # Signs the short-lived access tokens.
      - key: JWT_ACCESS_SECRET
        generateValue: true

      # Signs power commands and remote-desktop session grants. Agents pin the
      # public half. If this changes, every enrolled computer refuses every
      # command until it re-fetches the key — which is the correct behaviour and
      # a bad afternoon, so let Render generate it once and leave it alone.
      - key: POWER_SIGNING_KEY
        generateValue: true

      # Shared counters, because Render can run more than one instance and
      # per-process counters would make the effective limit limit x instances.
      # The API refuses to start in production on anything else.
      - key: RATE_LIMIT_STORE
        value: postgres

      # Who the emails say they are from. Set these in the dashboard to your
      # own company; the placeholders below are the product's own name.
      - key: BRAND_NAME
        sync: false
      - key: BRAND_URL
        sync: false
      - key: BRAND_SUPPORT_EMAIL
        sync: false
      - key: BRAND_FOOTER
        sync: false

      - key: MAIL_TRANSPORT
        value: smtp
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'

      # Never true outside development. The API refuses to start with it on in
      # production, which is why it is pinned here rather than left to a default.
      - key: EXPOSE_DEV_OTP
        value: 'false'

      # The mobile app is not a browser and sends no Origin header, so it needs
      # nothing here. This is for the desktop app during development.
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://wails.localhost

      - key: ENABLE_OPENAPI
        value: 'false'

      # Off by default. The endpoint carries no personal data, but it is still
      # an unauthenticated description of how the system is behaving.
      - key: ENABLE_METRICS
        value: 'false'

      # STUN lets two peers discover their own public addresses. Without a TURN
      # server, remote desktop works only where a direct path exists — which is
      # most home networks and not most mobile ones. See docs/DEPLOY.md.
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302
